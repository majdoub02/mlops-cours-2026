apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
      - name: minio
        image: bitnamilegacy/minio:latest
        imagePullPolicy: IfNotPresent
        env:
        - { name: MINIO_ROOT_USER, value: "minioadmin" }
        - { name: MINIO_ROOT_PASSWORD, value: "minioadmin123" }
        - { name: MINIO_DEFAULT_BUCKETS, value: "mlops-test" }
        ports:
        - { containerPort: 9000, name: api }
        - { containerPort: 9001, name: console }
        volumeMounts:
        - { name: data, mountPath: /bitnami/minio/data }
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector: { app: minio }
  ports:
  - { name: api, port: 9000, targetPort: 9000 }
  - { name: console, port: 9001, targetPort: 9001 }
