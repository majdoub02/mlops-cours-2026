stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/titanic.csv
    params:
      - prepare
    outs:
      - data/processed/X_train.parquet
      - data/processed/X_test.parquet
      - data/processed/y_train.parquet
      - data/processed/y_test.parquet
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/X_train.parquet
      - data/processed/X_test.parquet
      - data/processed/y_train.parquet
      - data/processed/y_test.parquet
    params:
      - train
    metrics:
      - metrics.json:
          cache: false
